<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dashboard | AL MANARAH GLOBAL SERVICES</title>
<meta name="theme-color" content="#101b45">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">
<style>
body{background:#f4f5fa}
.ad-head{background:#101b45;color:#fff;position:sticky;top:0;z-index:20}
.ad-head .container{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.ad-head img{height:46px;background:#fff;border-radius:10px;padding:4px 8px}
.ad-head h1{font:700 1.1rem var(--sans);color:#fff;margin:0;flex:1}
.ad-head button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;padding:7px 12px;font:700 .85rem var(--sans);cursor:pointer}
.ad-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.ad-tabs button{border:1px solid #dfe1e9;background:#fff;border-radius:999px;padding:9px 14px;font:700 .9rem var(--sans);color:#101b45;cursor:pointer}
.ad-tabs button.on{background:#101b45;color:#fff;border-color:#101b45}
.ad-tabs b{display:inline-block;min-width:22px;padding:1px 6px;border-radius:999px;background:#b78a32;color:#fff;font-size:.78rem;margin-left:4px}
#adSearch{width:100%;padding:12px 14px;border:1px solid #dfe1e9;border-radius:12px;font:500 1rem var(--sans);margin-bottom:14px}
.ad-card{display:block;background:#fff;border:1px solid #dfe1e9;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.ad-card summary{list-style:none;cursor:pointer}
.ad-card summary::-webkit-details-marker{display:none}
.ad-card.todo{border-left:6px solid #b78a32}.ad-card.ok{border-left:6px solid #1f8f4e}.ad-card.no{border-left:6px solid #c0392b;opacity:.75}
.ad-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ad-top b{font-size:1.08rem;color:#101b45}
.ad-badge{font:700 .74rem var(--sans);background:#e7e9f3;color:#101b45;border-radius:999px;padding:4px 10px;white-space:nowrap}
.ad-card p{margin:8px 0}
.ad-muted{color:#5a6178;font-size:.86rem}
.ad-money{font-size:.88rem;color:#101b45}
.ad-pre{white-space:pre-wrap;background:#f4f5fa;border-radius:10px;padding:8px 10px;font-size:.88rem}
.ad-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ad-danger{color:#c0392b!important;border-color:#e6b0aa!important}
.btn-wa{background:#25d366;color:#fff;border:0}
.ad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.ad-mini{display:block;font:700 .78rem var(--sans);color:#5a6178;margin:6px 0}
.ad-mini select,.ad-mini textarea,.ad-row input,.ad-row select,.ad-box textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid #dfe1e9;border-radius:10px;font:500 .92rem var(--sans);background:#fff}
.ad-box{background:#f8f9fc;border:1px dashed #c9cde0;border-radius:12px;padding:10px 12px;margin-top:12px}
.ad-box h4{margin:0 0 4px;font:800 .92rem var(--sans);color:#101b45}
.ad-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ad-row input,.ad-row select{flex:1 1 140px;width:auto;margin:0}
.ad-okmsg{color:#1f8f4e;font-weight:800}
.ad-sub{margin:22px 0 10px;font:800 1rem var(--sans);color:#101b45}
.ad-empty{background:#fff;border-radius:16px;padding:24px;text-align:center;color:#5a6178;font-weight:700}
.ad-price{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dfe1e9;border-radius:12px;padding:8px 12px;margin-bottom:6px}
.ad-price span{flex:1}.ad-price b{display:block;font-size:.9rem;color:#101b45}.ad-price small{color:#5a6178;font-size:.76rem}
.ad-price input{width:110px;padding:9px;border:1px solid #c9cde0;border-radius:10px;font:800 .95rem var(--sans);text-align:right}
.ad-sticky{position:sticky;bottom:10px;text-align:right;margin-top:12px}
.ad-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#101b45;color:#fff;padding:12px 18px;border-radius:14px;font:700 .92rem var(--sans);opacity:0;transition:.25s;z-index:50;max-width:92vw}
.ad-toast.on{opacity:1;transform:translate(-50%,0)}.ad-toast.bad{background:#c0392b}
.ad-busy{cursor:progress}.ad-busy #adList{opacity:.6}
#adLogin{max-width:420px;margin:60px auto;background:#fff;border-radius:20px;padding:28px;border:1px solid #dfe1e9;text-align:center}
#adLogin img{height:90px}
#adLogin input{width:100%;padding:13px;border:1px solid #c9cde0;border-radius:12px;font:600 1rem var(--sans);margin:14px 0}
#adLoginMsg{min-height:1.2em;color:#c0392b;font-weight:700;font-size:.9rem}
</style>
</head>
<body data-page="admin">
<section id="adLogin" hidden>
  <img src="logo-wide.png" alt="AL MANARAH GLOBAL SERVICES">
  <h2 style="font:700 1.3rem var(--sans);color:#101b45;margin:10px 0 0">Private dashboard</h2>
  <form id="adLoginForm"><input type="password" id="adPw" placeholder="Password" autocomplete="current-password" required><button class="btn btn-primary" type="submit" style="width:100%">Log in</button></form>
  <p id="adLoginMsg"></p>
</section>
<div id="adApp" hidden>
  <header class="ad-head"><div class="container"><img src="logo-wide.png" alt=""><h1>Dashboard</h1><button type="button" id="adRefresh">↻ Refresh</button><button type="button" id="adLogout">Log out</button></div></header>
  <main class="container" style="padding-bottom:60px">
    <nav class="ad-tabs">
      <button type="button" data-tab="check">Payments to check <b id="cCheck">0</b></button>
      <button type="button" data-tab="enq">Customers &amp; enquiries <b id="cOpen">0</b></button>
      <button type="button" data-tab="pay">Payments &amp; receipts</button>
      <button type="button" data-tab="hotels">Hotel prices</button>
      <button type="button" data-tab="settings">Settings</button>
    </nav>
    <input id="adSearch" type="search" placeholder="Search name, phone, reference…">
    <div id="adList"></div>
  </main>
</div>
<div id="adToast" class="ad-toast" role="status"></div>
<script src="config.js"></script>
<script src="main.js"></script>
<script src="admin.js"></script>
</body>
</html>
